<article class="blog-post">
    <nav class="post-nav" aria-label="Article navigation">
        <a class="post-nav__link post-nav__home" href="/">Home</a>
        $next_link
        $prev_link
    </nav>
    <header class="post-header">
        <h1 class="post-title">$title</h1>
        <time class="post-date" datetime="$created_at">$display_date</time>
    </header>
    <div class="post-layout $layout_class">
        <div class="post-content">$content</div>
        $media
    </div>
    $atmosphere_link
</article>
